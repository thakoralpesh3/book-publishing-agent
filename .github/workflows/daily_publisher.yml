name: PublisheR AI • Cloud Book Publishing Pipeline

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom Book Topic (leave empty to auto-pick from daily Amazon/Flipkart trends)'
        required: false
        default: ''
        type: string
      category:
        description: 'Trending Category (if topic empty)'
        required: true
        default: 'kids'
        type: choice
        options:
          - kids
          - wealth
          - self-help
          - tech
          - business
      model:
        description: 'Gemini Model'
        required: true
        default: 'gemini-4-argon'
        type: choice
        options:
          - 'gemini-4-argon'
          - 'gemini-3.7-flash'
          - 'gemini-3.8-flash'
          - 'gemini-3.5-flash'
      chapters:
        description: 'Number of Chapters'
        required: true
        default: '5'
        type: string
      trim_size:
        description: 'Trim Size'
        required: true
        default: '6x9'
        type: choice
        options:
          - '6x9'
          - '8.5x11'
          - '5.5x8.5'
      book_type:
        description: 'Book Structure Type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - standard
          - activity_drawing
          - workbook_journal
      author:
        description: 'Author Name'
        required: false
        default: 'Alpesh Patel'
        type: string
      publisher:
        description: 'Publisher Name'
        required: false
        default: 'InspireBooks Press'
        type: string
      create_release:
        description: 'Publish as GitHub Release with downloadable PDFs'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish-book:
    name: Generate Publication-Grade Book
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Book Publishing Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || 'gemini-4-argon' }}
          DEFAULT_AUTHOR: ${{ inputs.author || 'Alpesh Patel' }}
          DEFAULT_PUBLISHER: ${{ inputs.publisher || 'InspireBooks Press' }}
          DEFAULT_MARKETPLACE: "Amazon.in"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            echo "Generating book for custom topic: ${{ inputs.topic }}"
            python3 main.py generate --topic "${{ inputs.topic }}" \
              --chapters ${{ inputs.chapters || '5' }} \
              --trim-size ${{ inputs.trim_size || '6x9' }} \
              --book-type ${{ inputs.book_type || 'auto' }}
          else
            echo "Generating book from daily ${{ inputs.category || 'kids' }} trends..."
            python3 main.py run-background --force --category "${{ inputs.category || 'kids' }}"
          fi

      - name: Run Preflight Zero-Mistake Audit
        env:
          RUN_NUMBER: ${{ github.run_number }}
          CHOSEN_MODEL: ${{ inputs.model || 'gemini-4-argon' }}
        run: |
          python3 scripts/cloud_audit_summary.py

      - name: Upload Generated Book Artifacts (PDFs, Catalogs, Dossiers)
        uses: actions/upload-artifact@v4
        with:
          name: published-books-${{ github.run_number }}
          path: |
            output/**/*.pdf
            output/**/*.jpg
            output/**/*.xlsx
            output/**/*.md
            output/**/metadata.json
            output/**/preflight_audit_report.json
          retention-days: 30

      - name: Publish GitHub Release with Downloadable Book Files
        if: ${{ inputs.create_release != false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="book-run-${{ github.run_number }}"
          TITLE="PublisheR AI • Book Release #${{ github.run_number }}"
          FILES=$(find output -type f \( -name "*.pdf" -o -name "*.jpg" -o -name "*.xlsx" -o -name "*.md" -o -name "metadata.json" \))
          if [ -n "$FILES" ]; then
            echo "Publishing release $TAG_NAME with files:"
            echo "$FILES"
            gh release create "$TAG_NAME" $FILES \
              --title "$TITLE" \
              --notes "Autonomous book publication run #${{ github.run_number }}. Certified by 25-point Zero-Mistake Preflight Audit." || echo "Release creation skipped or already exists."
          fi
