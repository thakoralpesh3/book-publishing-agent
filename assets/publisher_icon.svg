<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Rounded Tile -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Glowing Circular Backdrop -->
  <circle cx="256" cy="245" r="140" fill="#3b82f6" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Open Book Base / Hardcover -->
  <path d="M 80 340 C 140 330, 210 335, 256 360 C 302 335, 372 330, 432 340 L 432 180 C 372 170, 302 175, 256 200 C 210 175, 140 170, 80 180 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="6"/>

  <!-- Left Pages Stack -->
  <path d="M 86 330 C 144 322, 210 326, 252 350 L 252 190 C 210 166, 144 162, 86 170 Z" fill="url(#pageGrad)"/>
  
  <!-- Right Pages Stack -->
  <path d="M 426 330 C 368 322, 302 326, 260 350 L 260 190 C 302 166, 368 162, 426 170 Z" fill="url(#pageGrad)"/>

  <!-- Spine Center Glow Line -->
  <line x1="256" y1="188" x2="256" y2="355" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Content Lines on Pages -->
  <!-- Left Page Lines -->
  <line x1="115" y1="205" x2="225" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="230" x2="225" y2="230" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="250" x2="225" y2="250" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="270" x2="195" y2="270" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right Page Lines -->
  <line x1="287" y1="205" x2="397" y2="205" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="287" y1="230" x2="397" y2="230" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="287" y1="250" x2="397" y2="250" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="287" y1="270" x2="345" y2="270" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Magic Feather Quill / AI Wand -->
  <g transform="translate(300, 95) rotate(25)" filter="url(#glow)">
    <path d="M 0 0 C 15 -35, 45 -45, 75 -50 C 65 -20, 50 10, 20 40 L 0 50 Z" fill="url(#accentGrad)"/>
    <line x1="0" y1="50" x2="-20" y2="80" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Amazon Amber Sparkle -->
  <circle cx="130" cy="115" r="9" fill="#f59e0b" filter="url(#glow)"/>
  <polygon points="130,95 133,110 148,115 133,120 130,135 127,120 112,115 127,110" fill="#fbbf24"/>

  <!-- Flipkart Blue Sparkle -->
  <circle cx="380" cy="120" r="8" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="380,105 383,117 395,120 383,123 380,135 377,123 365,120 377,117" fill="#60a5fa"/>

  <!-- Bottom Platform Badges -->
  <!-- Amazon Badge -->
  <g transform="translate(130, 410)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24" text-anchor="middle">AMAZON</text>
  </g>
  <!-- Flipkart Badge -->
  <g transform="translate(382, 410)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#2563eb" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" font-size="13" fill="#38bdf8" text-anchor="middle">FLIPKART</text>
  </g>
  <!-- Plus / AI Core Icon in Center -->
  <circle cx="256" cy="410" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
  <text x="256" y="416" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">✦</text>
</svg>
